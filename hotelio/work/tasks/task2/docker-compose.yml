version: "3.8"

services:
  monolith:
    build:
      context: ./dev/hotelio-monolith
      dockerfile: Dockerfile
    image: hotelio-monolith:1.0.1
    container_name: hotelio-monolith
    ports:
      - "8084:8080"
      - "9094:9090"
    networks:
      - hotelio-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://monolith-db:5432/hotelio
      SPRING_DATASOURCE_USERNAME: hotelio
      SPRING_DATASOURCE_PASSWORD: hotelio
      BOOKING_SERVICE_EXTERNAL_HOST: hotelio-booking-service
      BOOKING_SERVICE_EXTERNAL_PORT: 9090

  monolith-db:
    image: postgres:15
    container_name: hotelio-db
    environment:
      POSTGRES_USER: hotelio
      POSTGRES_PASSWORD: hotelio
      POSTGRES_DB: hotelio
    ports:
      - "5432:5432"
    volumes:
      - monolith-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net

  booking-service:
    build:
      context: ./dev/booking-service
      dockerfile: Dockerfile
    image: hotelio-booking-service:1.0.0
    container_name: hotelio-booking-service
    ports:
      - "8081:8080"
      - "9091:9090"
    networks:
      - hotelio-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://booking-db:5432/booking
      SPRING_DATASOURCE_USERNAME: booking
      SPRING_DATASOURCE_PASSWORD: booking
      MONOLITH_EXTERNAL_HOST: hotelio-monolith
      MONOLITH_EXTERNAL_PORT: 9090
      KAFKA_BOOTSTRAP_SERVERS:  hotelio-kafka:9092

  booking-db:
    image: postgres:15
    container_name: hotelio-booking-db
    environment:
      POSTGRES_USER: booking
      POSTGRES_PASSWORD: booking
      POSTGRES_DB: booking
    ports:
      - "5433:5432"
    volumes:
      - booking-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net

  booking-history-service:
    build:
      context: ./dev/booking-history-service
      dockerfile: Dockerfile
    image: hotelio-booking-history-service:0.0.1
    container_name: hotelio-booking-history-service
    ports:
      - "8082:8080"
    networks:
      - hotelio-net
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://hoteliostat-db:5432/hoteliostat
      SPRING_DATASOURCE_USERNAME: hoteliostat
      SPRING_DATASOURCE_PASSWORD: hoteliostat
      KAFKA_BOOTSTRAP_SERVERS:  hotelio-kafka:9092

  hoteliostat-db:
    image: postgres:15
    container_name: hoteliostat-db
    environment:
      POSTGRES_USER: hoteliostat
      POSTGRES_PASSWORD: hoteliostat
      POSTGRES_DB: hoteliostat
    ports:
      - "5434:5432"
    volumes:
      - hoteliostat-db-data:/var/lib/postgresql/data
    networks:
      - hotelio-net

  kafka:
    container_name: hotelio-kafka
    image: confluentinc/cp-kafka:7.2.1
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_LISTENERS: INTERNAL://0.0.0.0:29092,EXTERNAL://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:29092,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
    networks:
      - hotelio-net

  kafka-ui:
    container_name: kafka-ui
    image: provectuslabs/kafka-ui:latest
    ports:
      - 7070:8080
    environment:
      DYNAMIC_CONFIG_ENABLED: true
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - hotelio-net

  zookeeper:
    container_name: hotelio-zookeeper
    image: confluentinc/cp-zookeeper:7.2.1
    ports:
      - "2181:2181"
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
    networks:
      - hotelio-net

volumes:
  monolith-db-data:
  booking-db-data:
  hoteliostat-db-data:

networks:
  hotelio-net:
    external: true
