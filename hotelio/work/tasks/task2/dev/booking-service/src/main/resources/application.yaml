server:
  port: 8080

spring:
  application:
    name: booking-service

  grpc:
    server:
      port: 9090

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5433/booking}
    username: ${SPRING_DATASOURCE_USERNAME:booking}
    password: ${SPRING_DATASOURCE_PASSWORD:booking}

  jpa:
    hibernate:
      ddl-auto: create
    show-sql: true
    properties:
      hibernate.hibernate.format_sql: false

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JacksonJsonSerializer
      properties:
        spring.json.type.mapping: bookingEvent:com.hotelio.bookingservice.mq.BookingEventDto

monolith:
  port: ${MONOLITH_EXTERNAL_PORT:9094}
  host: ${MONOLITH_EXTERNAL_HOST:localhost}
